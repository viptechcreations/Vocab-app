<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vocab Master Icon Generator</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px; background: #f8fafc; }
    button { padding: 12px 24px; margin: 10px; font-size: 16px; font-weight: bold; color: #fff; background: #4f46e5; border: none; border-radius: 10px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Vocab Master PWA Icons</h2>
  <p>Niche buttons par click karke dono PNG icons download karein:</p>
  <button onclick="downloadIcon(192)">Download icon-192.png</button>
  <button onclick="downloadIcon(512)">Download icon-512.png</button>

  <script>
    const svgString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#4f46e5"/>
          <stop offset="100%" stop-color="#7c3aed"/>
        </linearGradient>
      </defs>
      <rect width="512" height="512" rx="115" fill="url(#bg)"/>
      <circle cx="256" cy="152" r="44" fill="#ffffff"/>
      <path d="M242 232 C205 212 150 208 116 218 C108 220 104 227 104 236 L104 358 C104 368 112 374 122 372 C156 364 205 368 242 390 Z" fill="#ffffff"/>
      <path d="M270 232 C307 212 362 208 396 218 C404 220 408 227 408 236 L408 358 C408 368 400 374 390 372 C356 364 307 368 270 390 Z" fill="#ffffff"/>
    </svg>`;

    function downloadIcon(size) {
      const img = new Image();
      const svgBlob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(svgBlob);

      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, size, size);
        URL.revokeObjectURL(url);

        const a = document.createElement("a");
        a.download = `icon-${size}.png`;
        a.href = canvas.toDataURL("image/png");
        a.click();
      };
      img.src = url;
    }
  </script>
</body>
</html>
